# ci-regression-run, the regression pipeline: decides project status (design §12, docs/ci_jobs.md).
# lint -> unit (Windows + Ubuntu) -> functional chain per OS (P0 -> P1 -> P2 | P3 | P4) -> quality-gate.
# A manual run chooses which functional jobs run; lint and the unit tests always run first.
name: ci-regression-run

# Only code and the files that control how it runs trigger CI; documentation never does: root Markdown
# (README, CHANGELOG, CLAUDE_LOG), docs/ and .claude/ are not listed, and the last pattern drops
# Markdown anywhere, even inside a listed folder.
on:
  push:
    paths:
      - "emi_*/**"
      - "tests/**"
      - "unittests/**"
      - "conftest.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".pylintrc"
      - ".github/**"
      - "!**/*.md"
  pull_request:
    branches: [main]
    paths:
      - "emi_*/**"
      - "tests/**"
      - "unittests/**"
      - "conftest.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".pylintrc"
      - ".github/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      p0:
        description: Run the P0 job (critical)
        type: boolean
        default: true
      p1:
        description: Run the P1 job (high)
        type: boolean
        default: true
      p2:
        description: Run the P2 job (standard)
        type: boolean
        default: true
      p3:
        description: Run the P3 job (low)
        type: boolean
        default: true
      p4:
        description: Run the P4 job (lowest)
        type: boolean
        default: true

# A pull request or feature-branch push cancels the older run of the same ref. Runs on main and manual
# runs get a group of their own (the run ID), so they are never cancelled and may run in parallel.
concurrency:
  group: >-
    ci-regression-run-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pylint 10.00/10
        run: >
          python -m pylint --rcfile=.pylintrc --fail-under=10.0
          emi_reader emi_sender emi_test_broker emi_greenmail emi_api emi_harness tests unittests conftest.py

  unit:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Every unit-test folder
        run: python -m pytest unittests -p no:cacheprovider --junitxml=reports/unit/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ runner.os }}
          path: reports/unit/
          if-no-files-found: warn

  # Pushes and pull requests have no inputs and run every job; a manual run runs the ticked ones.
  functional-ubuntu:
    needs: unit
    uses: ./.github/workflows/functional-chain.yml
    with:
      os: ubuntu-latest
      label: ubuntu
      run-p0: ${{ github.event_name != 'workflow_dispatch' || inputs.p0 }}
      run-p1: ${{ github.event_name != 'workflow_dispatch' || inputs.p1 }}
      run-p2: ${{ github.event_name != 'workflow_dispatch' || inputs.p2 }}
      run-p3: ${{ github.event_name != 'workflow_dispatch' || inputs.p3 }}
      run-p4: ${{ github.event_name != 'workflow_dispatch' || inputs.p4 }}
    secrets: inherit

  functional-windows:
    needs: unit
    uses: ./.github/workflows/functional-chain.yml
    with:
      os: windows-latest
      label: windows
      run-p0: ${{ github.event_name != 'workflow_dispatch' || inputs.p0 }}
      run-p1: ${{ github.event_name != 'workflow_dispatch' || inputs.p1 }}
      run-p2: ${{ github.event_name != 'workflow_dispatch' || inputs.p2 }}
      run-p3: ${{ github.event_name != 'workflow_dispatch' || inputs.p3 }}
      run-p4: ${{ github.event_name != 'workflow_dispatch' || inputs.p4 }}
    secrets: inherit

  quality-gate:
    needs: [unit, functional-ubuntu, functional-windows]
    if: >-
      ${{ !cancelled() && needs.unit.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.p0 || inputs.p1 || inputs.p2 || inputs.p3
      || inputs.p4) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # One folder per operating system, so the gate checks each one for every chosen job.
      - name: Download the Ubuntu reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-ubuntu-*
          path: all-reports/ubuntu
          merge-multiple: true
      - name: Download the Windows reports
        uses: actions/download-artifact@v4
        with:
          pattern: reports-windows-*
          path: all-reports/windows
          merge-multiple: true
      # A chosen job that left no collection (it never started) fails the gate: its tests never ran.
      - name: Quality gates over both operating systems
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_P0: ${{ inputs.p0 }}
          RUN_P1: ${{ inputs.p1 }}
          RUN_P2: ${{ inputs.p2 }}
          RUN_P3: ${{ inputs.p3 }}
          RUN_P4: ${{ inputs.p4 }}
        run: |
          expect=()
          for job in P0 P1 P2 P3 P4; do
            chosen="RUN_$job"
            if [ "$MANUAL" != "true" ] || [ "${!chosen}" = "true" ]; then expect+=(--expect "$job"); fi
          done
          mkdir -p all-reports/ubuntu all-reports/windows
          python -m emi_harness.gate all-reports/ubuntu all-reports/windows "${expect[@]}"
      - name: Build the Allure report once, from both operating systems
        if: always()
        env:
          ALLURE_VERSION: "2.30.0"
        run: |
          shopt -s nullglob
          results=(all-reports/*/reports/*/*/allure-results)
          if [ ${#results[@]} -eq 0 ]; then echo "no Allure results"; exit 0; fi
          curl -fsSL -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          "./allure-${ALLURE_VERSION}/bin/allure" generate "${results[@]}" -o allure-report --clean
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
      - if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('allure-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # Publishes the Allure report to GitHub Pages after a run on main. Needs Pages enabled with
  # "GitHub Actions" as the source; until then this job fails without affecting project status.
  allure-pages:
    needs: quality-gate
    if: >-
      ${{ !cancelled() && needs.quality-gate.result != 'skipped'
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
