# Starts Greenmail on the runner and waits until it is ready (design §12).
# Ubuntu: the greenmail/standalone container, same options as the README. Windows runners cannot run
# Linux containers, so there the standalone JAR runs on Java 17 in the background.
name: Start Greenmail
description: Start Greenmail (Docker on Linux, JAR on Windows) and wait for its readiness endpoint.
inputs:
  password:
    description: Password of the test user qa@example.com.
    required: false
    default: password
  version:
    description: Greenmail version.
    required: false
    default: 2.1.15
runs:
  using: composite
  steps:
    - name: Start the Greenmail container (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        GREENMAIL_PASSWORD: ${{ inputs.password }}
        GREENMAIL_VERSION: ${{ inputs.version }}
      run: >
        docker run -d --name greenmail_server
        -p 3025:3025 -p 3143:3143 -p 3993:3993 -p 8080:8080
        -e GREENMAIL_OPTS="-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=qa:${GREENMAIL_PASSWORD}@example.com"
        "greenmail/standalone:${GREENMAIL_VERSION}"

    - name: Set up Java 17 (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Cache the Greenmail JAR (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/greenmail
        key: greenmail-standalone-${{ inputs.version }}

    - name: Start the Greenmail JAR (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GREENMAIL_PASSWORD: ${{ inputs.password }}
        GREENMAIL_VERSION: ${{ inputs.version }}
      run: |
        $folder = Join-Path $env:RUNNER_TEMP "greenmail"
        $jar = Join-Path $folder "greenmail-standalone-$env:GREENMAIL_VERSION.jar"
        if (-not (Test-Path $jar)) {
          New-Item -ItemType Directory -Force $folder | Out-Null
          Invoke-WebRequest "https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/$env:GREENMAIL_VERSION/greenmail-standalone-$env:GREENMAIL_VERSION.jar" -OutFile $jar
        }
        Write-Output "JAR: $jar ($((Get-Item $jar).Length) bytes)"
        $java = Join-Path $env:JAVA_HOME "bin\java.exe"
        & $java -version
        # Started through WMI, not Start-Process: a child of this step ends with the step on Windows
        # runners (Greenmail logged its start, then vanished before the readiness step). WMI's process
        # has no parent here, so it lives until the job ends. It does not inherit this step's
        # environment, hence the full java path; cmd /c gives it the output files.
        $out = Join-Path $folder "greenmail.out.log"
        $err = Join-Path $folder "greenmail.err.log"
        $command = "cmd.exe /c `"`"$java`" -Dgreenmail.setup.test.all -Dgreenmail.hostname=127.0.0.1 " +
                   "-Dgreenmail.users=qa:$env:GREENMAIL_PASSWORD@example.com -jar `"$jar`" > `"$out`" 2> `"$err`"`""
        $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create `
          -Arguments @{ CommandLine = $command; CurrentDirectory = $folder }
        if ($created.ReturnValue -ne 0) { throw "Win32_Process.Create returned $($created.ReturnValue)" }
        Write-Output "Greenmail started as process $($created.ProcessId) (cmd.exe running java)"
        "GREENMAIL_PID=$($created.ProcessId)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

    - name: Wait for Greenmail readiness
      shell: bash
      run: |
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8080/api/service/readiness; then echo; exit 0; fi
          sleep 2
        done
        echo "::error::Greenmail not ready after 120 s (GREENMAIL_NOT_READY)"
        exit 1

    - name: Show Greenmail's output (Windows, when not ready)
      if: failure() && runner.os == 'Windows'
      shell: pwsh
      run: |
        $folder = Join-Path $env:RUNNER_TEMP "greenmail"
        Write-Output "started process: $env:GREENMAIL_PID"
        $running = @(Get-CimInstance Win32_Process -Filter "Name = 'java.exe' OR Name = 'cmd.exe'" |
          Where-Object { $_.ProcessId -eq [int]$env:GREENMAIL_PID -or $_.ParentProcessId -eq [int]$env:GREENMAIL_PID })
        if ($running.Count -eq 0) { Write-Output "Greenmail's process is not running" }
        $running | Format-Table ProcessId, ParentProcessId, Name, CreationDate -AutoSize
        foreach ($name in "greenmail.out.log", "greenmail.err.log") {
          Write-Output "----- $name"
          Get-Content (Join-Path $folder $name) -ErrorAction SilentlyContinue | Select-Object -Last 60
        }

    - name: Show Greenmail's output (Linux, when not ready)
      if: failure() && runner.os == 'Linux'
      shell: bash
      run: docker logs --tail 60 greenmail_server || true
