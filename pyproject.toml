[project]
name = "ap-imap-emailclient"
version = "0.1.0"
description = "Email tool (SMTP send, IMAP check), Python library and test harness for end-to-end tests that wait for application emails and extract their call-to-action links."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Aleksandr Polskiy" }]
dependencies = [
    "beautifulsoup4==4.14.3",
    "python-dotenv==1.2.2",
]

[tool.pytest.ini_options]
# Design §4: EMI naming instead of pytest's default test_* collection.
python_files = ["emi_*.py"]
python_classes = ["TestEMI*"]
python_functions = ["EMI_*"]
testpaths = ["unittests", "tests"]
addopts = "-p no:randomly"
# Design §13.2 (AMB-73): network-fault tests, run alone with -m network.
markers = ["network: a connection fails (refused, dropped, timed out, port taken, limit) and the tool's handling is checked"]
# Design §13.4: the harness counts passing asserts, so a functional test that checks nothing fails
# with CASE_NO_VERIFICATION.
enable_assertion_pass_hook = true
