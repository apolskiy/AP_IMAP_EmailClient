# One functional job (design §12): Python 3.14 and the pinned requirements, Greenmail, the test broker,
# then one harness command. Reports and the broker log are uploaded whatever the outcome. The command's
# exit code is an output (0 passed, 1 failed, 2 aborted) and also decides the job's result.
name: Harness job
description: Set up Python, Greenmail and the test broker, run one harness command, upload reports and logs.
inputs:
  command:
    description: Arguments after "python -m", e.g. "emi_harness.cli --priority P0 -n 4".
    required: true
  artifact:
    description: Name of the uploaded reports artifact.
    required: true
  password:
    description: Password of the Greenmail test user.
    required: false
    default: password
  run-id:
    description: Run ID shared by the jobs of one chain (empty for a new one).
    required: false
    default: ""
  previous:
    description: >-
      Artifact pattern of earlier jobs of the same run (e.g. reports-ubuntu-p0). Their results are put
      in place before the run, so dependents of their failed tests are skipped (AMB-65), and removed
      before the upload, so no result is counted twice.
    required: false
    default: ""
outputs:
  exit-code:
    description: Exit code of the harness command.
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install requirements
      shell: bash
      run: python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Start Greenmail
      uses: ./.github/actions/start-greenmail
      with:
        password: ${{ inputs.password }}

    - name: Start the test broker
      shell: bash
      env:
        EMI_IMAP_PASSWORD: ${{ inputs.password }}
        EMI_SMTP_PASSWORD: ${{ inputs.password }}
      run: python -m emi_test_broker start

    - name: Download the earlier jobs' results
      if: inputs.previous != ''
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.previous }}
        path: .emi-previous

    # Relative paths only: in Git Bash on Windows a backslash runner path would be read as escapes.
    # download-artifact unpacks a single matching artifact straight into the path and several into
    # one folder each, so the results sit at either depth.
    - name: Put the earlier jobs' results in place
      if: inputs.previous != ''
      shell: bash
      run: |
        shopt -s nullglob
        : > .emi-previous/copied.txt
        for job in .emi-previous/reports/*/*/ .emi-previous/*/reports/*/*/; do
          relative="reports/${job#*/reports/}"
          mkdir -p "$relative" && cp -R "$job". "$relative"
          echo "$relative" >> .emi-previous/copied.txt
        done
        cat .emi-previous/copied.txt
        if [ ! -s .emi-previous/copied.txt ]; then
          echo "::error::no earlier job results found in the downloaded artifacts"; exit 1
        fi

    - name: Run the harness
      id: run
      shell: bash
      env:
        EMI_IMAP_PASSWORD: ${{ inputs.password }}
        EMI_SMTP_PASSWORD: ${{ inputs.password }}
        EMI_RUN_ID: ${{ inputs.run-id }}
        HARNESS_COMMAND: ${{ inputs.command }}
      run: |
        set +e
        python -m $HARNESS_COMMAND
        code=$?
        if [ "$code" = "5" ]; then
          echo "::notice::no tests selected for: $HARNESS_COMMAND"
          code=0
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Remove the earlier jobs' results
      if: always() && inputs.previous != ''
      shell: bash
      run: |
        if [ -f .emi-previous/copied.txt ]; then
          while read -r relative; do [ -n "$relative" ] && rm -rf "$relative"; done < .emi-previous/copied.txt
        fi

    - name: Stop the test broker
      if: always()
      shell: bash
      run: python -m emi_test_broker stop || true

    - name: Upload reports and the broker log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: |
          reports/
          logs/
        if-no-files-found: warn

    - name: Job result
      shell: bash
      run: |
        code="${{ steps.run.outputs.exit-code }}"
        case "$code" in
          0) echo "job passed" ;;
          1) echo "::error::job failed (exit 1)"; exit 1 ;;
          2) echo "::error::job aborted (exit 2): later jobs of the chain do not run"; exit 2 ;;
          *) echo "::error::harness exit code '$code'"; exit 1 ;;
        esac
